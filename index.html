<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Portfel IKZE</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{--bg:#eceff3;--sf:#fff;--ink:#14202b;--mu:#5b6976;--ln:#d7dde4;--ac:#1d5d8f;--pos:#16754f;--neg:#bb3a2c;--soft:#e4ebf2;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e161d;--sf:#16212b;--ink:#e5ecf2;--mu:#93a2b0;--ln:#273544;--ac:#6fb1e3;--pos:#4fc593;--neg:#f0847a;--soft:#1e2d3b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e161d;--sf:#16212b;--ink:#e5ecf2;--mu:#93a2b0;--ln:#273544;--ac:#6fb1e3;--pos:#4fc593;--neg:#f0847a;--soft:#1e2d3b;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;font-variant-numeric:tabular-nums}
main{max-width:1100px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:22px;margin:0;font-weight:600}
h2{font-size:16px;margin:0 0 12px;font-weight:600}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.mu{color:var(--mu);font-size:13px}
.pos{color:var(--pos)}.neg{color:var(--neg)}
section{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:16px;margin-bottom:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--ln);border:1px solid var(--ln);border-radius:10px;overflow:hidden;margin-bottom:14px}
.kpi{background:var(--sf);padding:12px 14px}
.kpi b{display:block;font-size:20px;font-weight:600;margin-top:2px}
.kpi.big b{font-size:28px}
.wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:640px}
th,td{text-align:right;padding:7px 8px;border-bottom:1px solid var(--ln);white-space:nowrap}
th{font-weight:500;color:var(--mu);font-size:13px}
th:first-child,td:first-child{text-align:left}
tr:last-child td{border-bottom:0}
input,select,button{font:inherit;color:var(--ink);background:var(--sf);border:1px solid var(--ln);border-radius:6px;padding:7px 9px}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
button{cursor:pointer}
button.pri{background:var(--ac);border-color:var(--ac);color:var(--sf);font-weight:500}
button.sm{padding:3px 8px;font-size:13px}
td input{width:96px;text-align:right;padding:4px 6px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;align-items:end}
.form label{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--mu)}
.form input,.form select{width:100%}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.seg button.on{background:var(--ac);border-color:var(--ac);color:var(--sf)}
.bar{height:8px;background:var(--soft);border-radius:4px;overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:var(--ac)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:760px){.two{grid-template-columns:1fr}}
.two>section{margin:0}
.al{display:grid;grid-template-columns:1fr 64px 64px 78px;gap:6px 10px;align-items:center;font-size:14px}
.al input{width:64px;padding:3px 6px;text-align:right}
.note{padding:10px 12px;background:var(--soft);border-radius:8px;font-size:13px;margin-bottom:12px}
#err{color:var(--neg);font-size:13px;min-height:18px;margin-top:8px}
.stack{display:flex;height:22px;border-radius:5px;overflow:hidden;background:var(--soft);margin:10px 0 14px;gap:1px}
.stack i{display:block;height:100%}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px}
.geo-h{display:flex;gap:28px;flex-wrap:wrap;align-items:baseline}
.geo-h b{font-size:20px;font-weight:600}.geo-h b.big{font-size:34px}
a{color:var(--ac)}
label.btn{display:inline-block;cursor:pointer}
svg text{fill:var(--mu);font-size:11px}
</style>
</head>
<body>
<main>
<header>
 <div><h1>Portfel IKZE</h1><div class="mu" id="stamp">Ładowanie…</div></div>
 <div class="seg" style="margin:0"><button id="bTheme" class="sm">Motyw</button><button id="bBak" class="sm">Kopia danych</button>
 <label class="sm btn" style="border:1px solid var(--ln);border-radius:6px;padding:3px 8px;font-size:13px">Import<input type="file" id="fImp" accept=".json" hidden></label><button id="bCsv" class="sm">CSV</button></div>
</header>
<div id="app"></div>
</main>
<script src="app.js"></script>
</body>
</html>
